name: Zion checks

on:
  push:
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      ZION_BROWSER_CONTAINER: zion-browser-${{ github.run_id }}-${{ github.run_attempt }}
      ZION_PLAYWRIGHT_WS_ENDPOINT: ws://127.0.0.1:9347
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: composer install --no-interaction --prefer-dist
      - run: npm run build
      - run: git diff --exit-code -- themes/zion-theme/assets/dist/
      - run: composer lint
      - run: composer test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm run env:start
      - run: npm run demo:test
      - run: npm run test:integration
      - run: npm run test:migration
      - name: Start Chromium with preinstalled system dependencies
        run: bash scripts/ci-browser.sh start
      - run: npm run test:e2e
      - name: Stop browser container
        if: always()
        run: bash scripts/ci-browser.sh stop
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results/
